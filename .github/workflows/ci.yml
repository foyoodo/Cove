name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Vet, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      # The UI font on the development machine is Noto Sans (system-ui),
      # with DejaVu Sans for symbols such as ↵ and WenQuanYi Micro Hei for
      # Han. Ubuntu otherwise prefers Cantarell for system-ui, which changes
      # the measurements these tests check.
      - name: Install UI fonts
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-noto-core \
            fonts-dejavu-core \
            fonts-dejavu-mono \
            fonts-wqy-microhei
          sudo tee /etc/fonts/conf.d/99-cove-system-ui.conf >/dev/null <<'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <match>
              <test name="family" compare="eq"><string>system-ui</string></test>
              <edit name="family" mode="assign" binding="strong"><string>Noto Sans</string></edit>
            </match>
          </fontconfig>
          EOF
          fc-cache -f
          fc-match system-ui
          fc-match sans-serif

      - name: Test
        # Three verbose runs record TestThemeSwitchMainThreadBound's
        # absolute generation time. -v keeps PERF-RETRY lines on a pass,
        # including a calibration-gate retry: test name plus both
        # attempts' reference and calibration durations and their ratios.
        # The main package takes several minutes; the default 10m limit is close.
        run: |
          set -euo pipefail
          for run in 1 2 3; do
            echo "SUITE-RUN ${run}"
            log="${RUNNER_TEMP}/go-test-${run}.txt"
            set +e
            go test -timeout 20m -count=1 -v ./... | tee "$log"
            code=${PIPESTATUS[0]}
            set -e
            python3 - "$log" <<'PY'
          import sys
          passed = failed = 0
          skips = []
          retries = []
          for line in open(sys.argv[1], encoding="utf-8", errors="replace"):
              if line.startswith("--- PASS:"):
                  passed += 1
              elif line.startswith("--- FAIL:"):
                  failed += 1
              elif line.startswith("--- SKIP:"):
                  rest = line[len("--- SKIP:"):].strip()
                  skips.append(rest.split(" ", 1)[0])
              elif "PERF-RETRY:" in line:
                  retries.append(line[line.find("PERF-RETRY:"):].rstrip())
          total = passed + failed + len(skips)
          print(f"TEST-SUMMARY: pass={passed} fail={failed} skip={len(skips)} total={total}")
          for name in skips:
              print(f"TEST-SKIP: {name}")
          if not retries:
              print("PERF-RETRY: none")
          for line in retries:
              print(line)
          PY
            if [[ "$code" -ne 0 ]]; then
              exit "$code"
            fi
          done

      # MyGo needs no cgo, so both Mac apps cross-compile on Linux.
      # darwin/universal compiles arm64 and amd64, then writes one fat
      # Mach-O. The macOS job ad-hoc signs the bundles that ship.
      - name: Build Cove.app for darwin/arm64 and darwin/universal
        run: CGO_ENABLED=0 go tool mygo build -platform darwin/arm64,darwin/universal

      - name: Package Cove.app
        run: .github/scripts/package-darwin-app.sh Cove-darwin-arm64.zip

      - name: Package the universal Cove.app
        run: .github/scripts/package-darwin-app.sh Cove-darwin-universal.zip darwin-universal

      - name: Upload unsigned Cove.app builds
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-darwin-apps
          path: |
            Cove-darwin-arm64.zip
            Cove-darwin-universal.zip
          retention-days: 1
          if-no-files-found: error

      # Preview packages: unsigned linux/amd64 tar.gz and windows/amd64 zip.
      # Not a .deb, NSIS installer, AppImage, MSI, or arm64 archive.
      - name: Build linux/amd64 and windows/amd64
        run: CGO_ENABLED=0 go tool mygo build -platform linux/amd64,windows/amd64

      - name: Compile windows/arm64
        run: CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -o /dev/null .

      - name: Package linux and windows preview archives
        run: .github/scripts/package-preview.sh

      - name: Upload linux and windows preview packages
        uses: actions/upload-artifact@v7
        with:
          name: preview-winlinux
          path: |
            Cove-*-linux-amd64.tar.gz
            Cove-*-linux-amd64.tar.gz.sha256
            Cove-*-windows-amd64.zip
            Cove-*-windows-amd64.zip.sha256
          retention-days: 5
          if-no-files-found: error

      - name: Linux preview smoke
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 \
            xvfb \
            x11-utils \
            xdotool \
            scrot \
            openbox
          version=$(python3 -c 'import json; print(json.load(open("mygo.json", encoding="utf-8"))["version"])')
          .github/scripts/smoke-linux.sh "Cove-${version}-linux-amd64.tar.gz" linux-smoke.png

      - name: Upload linux smoke screenshot
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-smoke
          path: linux-smoke.png
          retention-days: 5
          if-no-files-found: ignore

      - name: Linux preview end-to-end
        run: |
          set -euo pipefail
          chmod +x .github/scripts/e2e-linux.sh .github/scripts/mock-openai.py
          version=$(python3 -c 'import json; print(json.load(open("mygo.json", encoding="utf-8"))["version"])')
          .github/scripts/e2e-linux.sh \
            "Cove-${version}-linux-amd64.tar.gz" \
            linux-e2e-streaming.png \
            linux-e2e-complete.png

      - name: Upload linux end-to-end screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-e2e
          path: |
            linux-e2e-streaming.png
            linux-e2e-complete.png
          retention-days: 5
          if-no-files-found: error

  windows-smoke:
    name: Windows preview smoke
    needs: ci
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download preview packages
        uses: actions/download-artifact@v7
        with:
          name: preview-winlinux
          path: preview

      - name: Launch Cove.exe
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path preview -Filter "Cove-*-windows-amd64.zip" |
            Where-Object { $_.Name -notlike "*.sha256" } |
            Select-Object -First 1
          if (-not $zip) { throw "missing windows zip" }
          .\.github\scripts\smoke-windows.ps1 -Archive $zip.FullName -Screenshot windows-smoke.png

      - name: Upload screenshot
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-smoke
          path: windows-smoke.png
          retention-days: 5
          if-no-files-found: error

  sign-macos:
    name: Sign, verify, and launch
    needs: ci
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download unsigned builds
        uses: actions/download-artifact@v7
        with:
          name: unsigned-darwin-apps
          path: dist

      - name: Ad-hoc sign, verify, and launch
        run: |
          set -euo pipefail
          find dist -print
          chmod +x .github/scripts/sign-darwin-apps.sh
          .github/scripts/sign-darwin-apps.sh \
            dist/Cove-darwin-arm64.zip \
            dist/Cove-darwin-universal.zip \
            signed/Cove-darwin-arm64.zip \
            signed/Cove-darwin-universal.zip

      - name: Upload signed Cove.app zips
        uses: actions/upload-artifact@v7
        with:
          name: signed-darwin-apps
          path: |
            signed/Cove-darwin-arm64.zip
            signed/Cove-darwin-arm64.zip.sha256
            signed/Cove-darwin-universal.zip
            signed/Cove-darwin-universal.zip.sha256
          retention-days: 5
          if-no-files-found: error
