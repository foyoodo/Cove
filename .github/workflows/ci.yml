name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Vet, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      # The UI font on the development machine is Noto Sans (system-ui),
      # with DejaVu Sans for symbols such as ↵ and WenQuanYi Micro Hei for
      # Han. Ubuntu otherwise prefers Cantarell for system-ui, which changes
      # the measurements these tests check.
      - name: Install UI fonts
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-noto-core \
            fonts-dejavu-core \
            fonts-dejavu-mono \
            fonts-wqy-microhei
          sudo tee /etc/fonts/conf.d/99-cove-system-ui.conf >/dev/null <<'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <match>
              <test name="family" compare="eq"><string>system-ui</string></test>
              <edit name="family" mode="assign" binding="strong"><string>Noto Sans</string></edit>
            </match>
          </fontconfig>
          EOF
          fc-cache -f
          fc-match system-ui
          fc-match sans-serif

      - name: Test
        # The main package takes several minutes; the default 10m limit is close.
        run: go test -timeout 20m ./...

      # MyGo needs no cgo, so both Mac apps cross-compile on Linux.
      # darwin/universal compiles arm64 and amd64, then writes one fat
      # Mach-O. The macOS job ad-hoc signs the bundles that ship.
      - name: Build Cove.app for darwin/arm64 and darwin/universal
        run: CGO_ENABLED=0 go tool mygo build -platform darwin/arm64,darwin/universal

      - name: Package Cove.app
        run: .github/scripts/package-darwin-app.sh Cove-darwin-arm64.zip

      - name: Package the universal Cove.app
        run: .github/scripts/package-darwin-app.sh Cove-darwin-universal.zip darwin-universal

      - name: Upload unsigned Cove.app builds
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-darwin-apps
          path: |
            Cove-darwin-arm64.zip
            Cove-darwin-universal.zip
          retention-days: 1
          if-no-files-found: error

  sign-macos:
    name: Sign, verify, and launch
    needs: ci
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download unsigned builds
        uses: actions/download-artifact@v7
        with:
          name: unsigned-darwin-apps
          path: dist

      - name: Ad-hoc sign, verify, and launch
        run: |
          set -euo pipefail
          find dist -print
          chmod +x .github/scripts/sign-darwin-apps.sh
          .github/scripts/sign-darwin-apps.sh \
            dist/Cove-darwin-arm64.zip \
            dist/Cove-darwin-universal.zip \
            signed/Cove-darwin-arm64.zip \
            signed/Cove-darwin-universal.zip

      - name: Upload signed Cove.app zips
        uses: actions/upload-artifact@v7
        with:
          name: signed-darwin-apps
          path: |
            signed/Cove-darwin-arm64.zip
            signed/Cove-darwin-arm64.zip.sha256
            signed/Cove-darwin-universal.zip
            signed/Cove-darwin-universal.zip.sha256
          retention-days: 5
          if-no-files-found: error
