name: Release

# The tag names the release. mygo.json is what Cove.app records, so this
# workflow fails when the tag without the leading v is not that version.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, including the leading v (for example v0.7.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check the tag against mygo.json
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          tag = os.environ["RELEASE_TAG"].strip()
          if (
              not tag.startswith("v")
              or tag == "v"
              or "/" in tag
              or any(ch.isspace() for ch in tag)
          ):
              sys.exit(f"tag {tag!r} must look like vX.Y.Z")
          version = tag[1:]
          with open("mygo.json", encoding="utf-8") as f:
              config = json.load(f)["version"]
          if not isinstance(config, str) or config == "":
              sys.exit("mygo.json version is empty")
          if version != config:
              sys.exit(
                  f"tag version {version} does not match mygo.json version {config}. "
                  "Set version in mygo.json, commit, then tag that commit."
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\n")
              out.write(f"tag={tag}\n")
          print(f"releasing {tag} (mygo.json {config})")
          PY

      - name: Vet
        run: go vet ./...

      # Same faces as CI: Noto Sans for the UI, DejaVu for symbols, WenQuanYi for Han.
      - name: Install UI fonts
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-noto-core \
            fonts-dejavu-core \
            fonts-dejavu-mono \
            fonts-wqy-microhei
          sudo tee /etc/fonts/conf.d/99-cove-system-ui.conf >/dev/null <<'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <match>
              <test name="family" compare="eq"><string>system-ui</string></test>
              <edit name="family" mode="assign" binding="strong"><string>Noto Sans</string></edit>
            </match>
          </fontconfig>
          EOF
          fc-cache -f
          fc-match system-ui
          fc-match sans-serif

      - name: Test
        # -v prints every --- SKIP line and every PERF-RETRY line, including
        # a calibration-gate retry (test name, both attempts' reference
        # and calibration durations, and their ratios). The summary counts
        # pass, fail, and skip, including when the suite fails, and prints
        # each PERF-RETRY line. The main package takes several minutes;
        # the default 10m limit is close.
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/go-test.txt"
          set +e
          go test -timeout 20m -v ./... | tee "$log"
          code=${PIPESTATUS[0]}
          set -e
          python3 - "$log" <<'PY'
          import sys
          passed = failed = 0
          skips = []
          retries = []
          for line in open(sys.argv[1], encoding="utf-8", errors="replace"):
              if line.startswith("--- PASS:"):
                  passed += 1
              elif line.startswith("--- FAIL:"):
                  failed += 1
              elif line.startswith("--- SKIP:"):
                  rest = line[len("--- SKIP:"):].strip()
                  skips.append(rest.split(" ", 1)[0])
              elif "PERF-RETRY:" in line:
                  retries.append(line[line.find("PERF-RETRY:"):].rstrip())
          total = passed + failed + len(skips)
          print(f"TEST-SUMMARY: pass={passed} fail={failed} skip={len(skips)} total={total}")
          for name in skips:
              print(f"TEST-SKIP: {name}")
          if not retries:
              print("PERF-RETRY: none")
          for line in retries:
              print(line)
          PY
          exit "$code"

      - name: Build Cove.app for darwin/arm64 and darwin/universal
        run: CGO_ENABLED=0 go tool mygo build -platform darwin/arm64,darwin/universal

      - name: Package Cove.app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          .github/scripts/package-darwin-app.sh "Cove-${VERSION}-darwin-arm64.zip"
          .github/scripts/package-darwin-app.sh "Cove-${VERSION}-darwin-universal.zip" darwin-universal

      - name: Upload unsigned Cove.app builds
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-darwin-apps
          path: |
            Cove-${{ steps.version.outputs.version }}-darwin-arm64.zip
            Cove-${{ steps.version.outputs.version }}-darwin-universal.zip
          retention-days: 1
          if-no-files-found: error

      - name: Build linux/amd64 and windows/amd64
        run: CGO_ENABLED=0 go tool mygo build -platform linux/amd64,windows/amd64

      - name: Compile windows/arm64
        run: CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -o /dev/null .

      - name: Package linux and windows preview archives
        run: .github/scripts/package-preview.sh

      - name: Upload linux and windows preview packages
        uses: actions/upload-artifact@v7
        with:
          name: preview-winlinux
          path: |
            Cove-${{ steps.version.outputs.version }}-linux-amd64.tar.gz
            Cove-${{ steps.version.outputs.version }}-linux-amd64.tar.gz.sha256
            Cove-${{ steps.version.outputs.version }}-windows-amd64.zip
            Cove-${{ steps.version.outputs.version }}-windows-amd64.zip.sha256
          retention-days: 5
          if-no-files-found: error

      - name: Linux preview smoke
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 \
            xvfb \
            x11-utils \
            xdotool \
            scrot \
            openbox
          .github/scripts/smoke-linux.sh "Cove-${{ steps.version.outputs.version }}-linux-amd64.tar.gz" linux-smoke.png

      - name: Upload linux smoke screenshot
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-smoke
          path: linux-smoke.png
          retention-days: 5
          if-no-files-found: ignore

      - name: Linux preview end-to-end
        run: |
          set -euo pipefail
          chmod +x .github/scripts/e2e-linux.sh .github/scripts/mock-openai.py
          .github/scripts/e2e-linux.sh \
            "Cove-${{ steps.version.outputs.version }}-linux-amd64.tar.gz" \
            linux-e2e-streaming.png \
            linux-e2e-complete.png

      - name: Upload linux end-to-end screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-e2e
          path: |
            linux-e2e-streaming.png
            linux-e2e-complete.png
          retention-days: 5
          if-no-files-found: error

  windows-smoke:
    name: Windows preview smoke
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download preview packages
        uses: actions/download-artifact@v7
        with:
          name: preview-winlinux
          path: preview

      - name: Launch Cove.exe
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path preview -Filter "Cove-*-windows-amd64.zip" |
            Where-Object { $_.Name -notlike "*.sha256" } |
            Select-Object -First 1
          if (-not $zip) { throw "missing windows zip" }
          .\.github\scripts\smoke-windows.ps1 -Archive $zip.FullName -Screenshot windows-smoke.png

      - name: Upload screenshot
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-smoke
          path: windows-smoke.png
          retention-days: 5
          if-no-files-found: error

  sign:
    name: Sign, verify, and launch
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download unsigned builds
        uses: actions/download-artifact@v7
        with:
          name: unsigned-darwin-apps
          path: dist

      - name: Ad-hoc sign, verify, and launch
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          find dist -print
          chmod +x .github/scripts/sign-darwin-apps.sh
          .github/scripts/sign-darwin-apps.sh \
            "dist/Cove-${VERSION}-darwin-arm64.zip" \
            "dist/Cove-${VERSION}-darwin-universal.zip" \
            "signed/Cove-${VERSION}-darwin-arm64.zip" \
            "signed/Cove-${VERSION}-darwin-universal.zip"

      - name: Upload signed Cove.app zips
        uses: actions/upload-artifact@v7
        with:
          name: signed-darwin-apps
          path: signed/
          retention-days: 1
          if-no-files-found: error

  release:
    name: Publish
    needs: [build, sign, windows-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Download signed builds
        uses: actions/download-artifact@v7
        with:
          name: signed-darwin-apps
          path: signed

      - name: Download linux and windows preview packages
        uses: actions/download-artifact@v7
        with:
          name: preview-winlinux
          path: preview

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ["VERSION"]
          text = f"""## Install

          Cove {version} is ad-hoc signed and not notarized. It needs macOS 13 or newer.

          - Apple Silicon: unzip `Cove-{version}-darwin-arm64.zip`.
          - Intel Macs: unzip `Cove-{version}-darwin-universal.zip`. That app is a universal binary (arm64 and x86_64) and also runs on Apple Silicon.

          1. Move `Cove.app` to `/Applications`.
          2. Clear the quarantine flag, then open the app:

          ```sh
          xattr -dr com.apple.quarantine /Applications/Cove.app
          ```

          Open it once, then go to System Settings > Privacy & Security and click 'Open Anyway'. macOS will say the developer cannot be verified. That is expected for an ad-hoc signed app.

          ## Windows and Linux (preview)

          `Cove-{version}-windows-amd64.zip` and `Cove-{version}-linux-amd64.tar.gz` are unsigned preview builds. They are not a substitute for the Mac app.

          Known issues:

          - Linux needs GTK 3.
          - Without a CJK font, Chinese shows as boxes.
          - The Windows zip is unsigned. SmartScreen: More info → Run anyway.
          - UI shortcut labels still show ⌘, but the keys use Ctrl.
          - Box-drawing tables that mix CJK and ASCII may misalign.
          - Windows has no in-window menu bar. Settings is the sidebar's bottom-left button, so configuring an API key is unaffected. Keyboard shortcuts still work.
          """
          Path(os.environ["RUNNER_TEMP"], "install-notes.md").write_text(text)
          PY
          arm64=$(find signed -name "Cove-${VERSION}-darwin-arm64.zip" -print -quit)
          universal=$(find signed -name "Cove-${VERSION}-darwin-universal.zip" -print -quit)
          linux=$(find preview -name "Cove-${VERSION}-linux-amd64.tar.gz" -print -quit)
          windows=$(find preview -name "Cove-${VERSION}-windows-amd64.zip" -print -quit)
          if [[ -z $arm64 || -z $universal || ! -f ${arm64}.sha256 || ! -f ${universal}.sha256 ]]; then
            echo "signed artifacts are missing" >&2
            find signed -print >&2
            exit 1
          fi
          if [[ -z $linux || -z $windows || ! -f ${linux}.sha256 || ! -f ${windows}.sha256 ]]; then
            echo "preview artifacts are missing" >&2
            find preview -print >&2
            exit 1
          fi
          args=(
            gh release create "$TAG"
            --verify-tag
            --generate-notes
            --title "Cove ${VERSION}"
            --notes-file "${RUNNER_TEMP}/install-notes.md"
          )
          if [[ $VERSION == *-* ]]; then
            args+=(--prerelease)
          fi
          args+=(
            "$arm64" "${arm64}.sha256"
            "$universal" "${universal}.sha256"
            "$linux" "${linux}.sha256"
            "$windows" "${windows}.sha256"
          )
          "${args[@]}"
